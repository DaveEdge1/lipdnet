# Runs the lipd.net web app together with the PyleoTUPS import service, so
# PyleoTUPS is always the path for NOAA/PANGAEA import (no browser fallback
# needed in a real deployment).
#
#   WEB_PORT=3002 docker compose up --build -d
#
# Serves at http://<host>:${WEB_PORT} (default 3000). The website reaches the
# service in-network at http://noaa-service:8000 via NOAA_SERVICE_URL.
version: "3.8"

services:
  website:
    build: .
    command: npm start
    environment:
      - NODE_ENV=production
      - NOAA_SERVICE_URL=http://noaa-service:8000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - noaa-service
    restart: unless-stopped

  noaa-service:
    build: ./noaa-service
    # Not published to the host by default — only the website talks to it.
    # Uncomment to expose for debugging:
    # ports:
    #   - "8000:8000"
    restart: unless-stopped
